version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dokploy-postgres
    environment:
      POSTGRES_DB: dokploy
      POSTGRES_USER: dokploy
      POSTGRES_PASSWORD: dokploy123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokploy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dokploy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dokploy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dokploy
    environment:
      - DATABASE_URL=postgresql://dokploy:dokploy123@postgres:5432/dokploy
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - JWT_SECRET=your-secret-key-change-in-production
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-nextauth-secret-change-in-production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/dokploy:/app/apps/dokploy
      - ./packages/server:/app/packages/server
    command: pnpm dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: dokploy-network
